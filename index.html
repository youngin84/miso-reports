<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미소 디비전 파트너 리포트 · 2026년 8월</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;background:#f4f6fb;color:#222;min-height:100vh}
.topbar{background:#1a1f36;padding:14px 20px;display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px;font-weight:900;color:#ff6b35}
.topbar-title{font-size:16px;font-weight:700;color:#fff}
.topbar-month{margin-left:auto;font-size:13px;color:#8a9cc0;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}

/* ── Directory ── */
.dir-group{margin-bottom:28px}
.dir-group-title{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#8a9cc0;margin-bottom:10px;padding-left:2px}
.dir-item{display:flex;align-items:center;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-decoration:none;color:inherit;transition:box-shadow .18s,transform .18s}
.dir-item:hover{box-shadow:0 4px 14px rgba(0,0,0,.13);transform:translateY(-1px)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.4px;flex-shrink:0}
.b-MV{background:#e8f2ff;color:#1a73e8}
.b-MVS{background:#f3e8ff;color:#8b2ce8}
.dir-name{font-size:15px;font-weight:700;margin-left:10px;flex:1}
.dir-rgn{font-size:11px;color:#aaa;margin-top:1px}
.dir-right{text-align:right;margin-left:8px}
.dir-amt{font-size:14px;font-weight:800;color:#1a1f36}
.dir-rate{font-size:12px;margin-top:2px;font-weight:600}
.rc-hi{color:#0d9e5a}.rc-md{color:#f59d00}.rc-lo{color:#e53935}

/* ── Partner Report ── */
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.p-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.p-info{flex:1}
.p-name{font-size:21px;font-weight:900;color:#1a1f36;margin-top:4px;line-height:1.2}
.p-month{font-size:13px;color:#8a9cc0;margin-top:3px;font-weight:600}

/* Rate bar */
.rate-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.rate-bar-wrap{flex:1;background:#eef0f5;border-radius:8px;height:10px;overflow:hidden}
.rate-bar{height:100%;border-radius:8px;transition:width .7s ease}
.rate-val{font-size:15px;font-weight:800;min-width:44px;text-align:right}

/* Metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.met{background:#f7f8fc;border-radius:12px;padding:13px}
.met-lbl{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#aaa;margin-bottom:3px}
.met-val{font-size:20px;font-weight:900;color:#1a1f36}
.met-sub{font-size:11px;color:#aaa;margin-top:1px}
.met.dark{background:#1a1f36;grid-column:1/-1}
.met.dark .met-lbl{color:#607090}
.met.dark .met-val{color:#fff;font-size:24px}
.met.dark .met-sub{color:#607090}
.met.green{background:#edfbf4}
.met.green .met-val{color:#0d9e5a}

/* Next month */
.next-box{border-radius:12px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.next-set{background:#fff8ec;border:1.5px solid #ffd87a}
.next-empty{background:#f7f8fc;border:1.5px dashed #ddd}
.next-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#aaa}
.next-val{font-size:18px;font-weight:900;color:#f59d00}
.next-empty .next-val{font-size:14px;color:#ccc}

/* Regions */
.sec-title{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#aaa;margin-bottom:10px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{padding:7px 8px;text-align:left;background:#f4f6fb;font-size:10px;font-weight:700;color:#aaa;letter-spacing:.5px;text-transform:uppercase}
.rtable td{padding:9px 8px;border-bottom:1px solid #f0f2f7}
.rtable tr:last-child td{border:none}
.rtable .r{text-align:right;font-weight:700;color:#1a1f36}
.rpill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.rp-hi{background:#edfbf4;color:#0d9e5a}.rp-md{background:#fff8e1;color:#f59d00}.rp-lo{background:#fdeaea;color:#e53935}

.chart-box{margin-top:14px;height:190px;position:relative}

/* Back btn */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:#8a9cc0;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:16px;padding:6px 0}
.back-btn:hover{color:#1a1f36}
</style>
</head>

: 45, "partner": 36}], "generated": 45, "participated": 36, "rate": 80.0, "bank_amount": 121307, "aov": 3370, "sep_amount": 0}, {"pid": 92143, "name": "해찬익스프레스", "type": "MVS", "regions": [{"region": "경기 수원", "total": 183, "partner": 179}], "generated": 183, "participated": 179, "rate": 97.8, "bank_amount": 485228, "aov": 2711, "sep_amount": 0}, {"pid": 70345, "name": "행복나름이사", "type": "MVS", "regions": [{"region": "경기 시흥", "total": 62, "partner": 21}], "generated": 62, "participated": 21, "rate": 33.9, "bank_amount": 121307, "aov": 5777, "sep_amount": 0}, {"pid": 97034, "name": "뚜버기이사, 두꺼비", "type": "MVS", "regions": [{"region": "경기 안산", "total": 66, "partner": 31}], "generated": 66, "participated": 31, "rate": 47.0, "bank_amount": 212272, "aov": 6847, "sep_amount": 800000}, {"pid": 34692, "name": "아재용달이사", "type": "MVS", "regions": [{"region": "경기 평택", "total": 79, "partner": 75}], "generated": 79, "participated": 75, "rate": 94.9, "bank_amount": 212272, "aov": 2830, "sep_amount": 0}, {"pid": 84714, "name": "모범이사", "type": "MVS", "regions": [{"region": "대전", "total": 113, "partner": 107}], "generated": 113, "participated": 107, "rate": 94.7, "bank_amount": 353807, "aov": 3307, "sep_amount": 0}, {"pid": 36235, "name": "정겨운익스프레스", "type": "MVS", "regions": [{"region": "서울 강동구", "total": 78, "partner": 77}, {"region": "서울 광진구", "total": 116, "partner": 110}], "generated": 194, "participated": 187, "rate": 96.4, "bank_amount": 566079, "aov": 3027, "sep_amount": 0}];

function fmt(n){return Number(n).toLocaleString('ko-KR');}
function rateColor(r){return r>=80?'#0d9e5a':r>=50?'#f59d00':'#e53935';}
function ratePill(r){var c=r>=80?'rp-hi':r>=50?'rp-md':'rp-lo';return '<span class="rpill '+c+'">'+r+'%</span>';}
function dirRate(r){var c=r>=80?'rc-hi':r>=50?'rc-md':'rc-lo';return '<span class="'+c+'">'+r+'%</span>';}

function getPid(){
  var m=location.search.match(/[?&]pid=(\d+)/);
  return m?parseInt(m[1]):null;
}

function renderDir(){
  var mv=[],mvs=[];
  DATA.forEach(function(r){
    var regions=r.regions.map(function(x){return x.region.replace('경기 ','').replace('서울 ','');}).slice(0,3).join(', ')+(r.regions.length>3?' 외':'');
    var el='<a class="dir-item" href="?pid='+r.pid+'">'+
      '<div><span class="badge b-'+r.type+'">'+r.type+'</span>'+
      '<div class="dir-name">'+r.name+'</div>'+
      '<div class="dir-rgn">'+regions+'</div></div>'+
      '<div class="dir-right"><div class="dir-amt">'+fmt(r.bank_amount)+'원</div>'+
      '<div class="dir-rate">참여율 '+dirRate(r.rate)+'</div></div>'+
    '</a>';
    if(r.type==='MV') mv.push(el); else mvs.push(el);
  });
  document.getElementById('app').innerHTML=
    '<div class="dir-group"><div class="dir-group-title">MV · 대형이사 ('+mv.length+'개)</div>'+mv.join('')+'</div>'+
    '<div class="dir-group"><div class="dir-group-title">MVS · 소형이사 ('+mvs.length+'개)</div>'+mvs.join('')+'</div>';
}

function renderPartner(pid){
  var r=DATA.find(function(d){return d.pid===pid;});
  if(!r){
    document.getElementById('app').innerHTML='<div style="text-align:center;padding:60px 20px;color:#aaa"><p style="font-size:18px">파트너를 찾을 수 없습니다</p><p style="margin-top:8px">PID: '+pid+'</p><a href="?" style="display:inline-block;margin-top:16px;color:#1a73e8;font-weight:600">목록으로</a></div>';
    return;
  }

  var rc=rateColor(r.rate);
  var rw=Math.min(r.rate,100);
  var regionRows=r.regions.map(function(reg){
    var rate=reg.total>0?Math.round(reg.partner/reg.total*100):0;
    return '<tr><td>'+reg.region+'</td><td class="r">'+fmt(reg.total)+'</td><td class="r">'+fmt(reg.partner)+'</td><td style="text-align:right">'+ratePill(rate)+'</td></tr>';
  }).join('');

  var nextBox=r.sep_amount>0
    ?'<div class="next-box next-set"><div><div class="next-lbl">9월 예정 입금액</div><div class="next-val">'+fmt(r.sep_amount)+'원</div></div><span style="font-size:22px">💰</span></div>'
    :'<div class="next-box next-empty"><div class="next-lbl">9월 예정 입금액</div><div class="next-val">미정</div></div>';

  document.getElementById('app').innerHTML=
    '<a class="back-btn" href="?">← 전체 목록</a>'+
    '<div class="card">'+
      '<div class="p-header">'+
        '<div class="p-info">'+
          '<span class="badge b-'+r.type+'">'+r.type+'</span>'+
          '<div class="p-name">'+r.name+'</div>'+
          '<div class="p-month">2026년 8월 마감 리포트</div>'+
        '</div>'+
      '</div>'+
      '<div class="rate-row">'+
        '<div class="rate-bar-wrap"><div class="rate-bar" style="width:'+rw+'%;background:'+rc+'"></div></div>'+
        '<div class="rate-val" style="color:'+rc+'">'+r.rate+'%</div>'+
      '</div>'+
      '<div class="metrics">'+
        '<div class="met"><div class="met-lbl">생성건수</div><div class="met-val">'+fmt(r.generated)+'</div><div class="met-sub">건</div></div>'+
        '<div class="met green"><div class="met-lbl">참여건수</div><div class="met-val">'+fmt(r.participated)+'</div><div class="met-sub">건</div></div>'+
        '<div class="met dark"><div class="met-lbl">8월 정산금액</div><div class="met-val">'+fmt(r.bank_amount)+'<span style="font-size:15px;font-weight:400"> 원</span></div><div class="met-sub">참여건당 평균 '+fmt(r.aov)+'원</div></div>'+
      '</div>'+
      nextBox+
      '<div class="sec-title">지역별 참여 현황</div>'+
      '<table class="rtable"><thead><tr><th>지역</th><th style="text-align:right">생성</th><th style="text-align:right">참여</th><th style="text-align:right">참여율</th></tr></thead><tbody>'+regionRows+'</tbody></table>'+
      '<div class="chart-box"><canvas id="rc"></canvas></div>'+
    '</div>';

  setTimeout(function(){
    var ctx=document.getElementById('rc');
    if(!ctx) return;
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:r.regions.map(function(x){return x.region.replace('경기 ','').replace('서울 ','').replace('충북 ','');}),
        datasets:[
          {label:'생성',data:r.regions.map(function(x){return x.total;}),backgroundColor:'#dce8fb',borderRadius:4,borderSkipped:false},
          {label:'참여',data:r.regions.map(function(x){return x.partner;}),backgroundColor:rc+'cc',borderRadius:4,borderSkipped:false}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}}},
        scales:{x:{ticks:{font:{size:10}},grid:{display:false}},y:{ticks:{font:{size:10}},grid:{color:'#f0f2f7'}}}}
    });
  },60);
}

var pid=getPid();
if(pid) renderPartner(pid);
else renderDir();
</script>
</body>
</html>
