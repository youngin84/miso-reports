<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;color:#222;min-height:100vh}
.header{background:#1a1f36;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:700}
.logo{font-size:22px;font-weight:900;color:#ff6b35}
.container{max-width:680px;margin:0 auto;padding:16px}
.not-found{text-align:center;padding:60px 20px;color:#888}
.not-found h2{font-size:22px;margin-bottom:8px;color:#444}

/* Partner header card */
.partner-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.partner-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.type-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px}
.type-MV{background:#e8f4fd;color:#1a73e8}
.type-MVS{background:#fce8fd;color:#9c27b0}
.partner-name{font-size:20px;font-weight:800;color:#1a1f36}

/* Month tabs */
.month-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.month-tab{padding:8px 16px;border-radius:24px;border:2px solid #ddd;background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:#666}
.month-tab.active{border-color:#1a1f36;background:#1a1f36;color:#fff}

/* Metrics grid */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.metric{background:#f8f9ff;border-radius:12px;padding:14px}
.metric-label{font-size:11px;color:#888;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:800;color:#1a1f36}
.metric-sub{font-size:12px;color:#888;margin-top:2px}
.metric.highlight{background:#1a1f36;color:#fff}
.metric.highlight .metric-label{color:#aaa}
.metric.highlight .metric-value{color:#fff}
.metric.highlight .metric-sub{color:#aaa}
.metric.green-bg{background:#e8f8f0}
.metric.green-bg .metric-value{color:#0d9e5a}

/* Rate bar */
.rate-section{margin-bottom:16px}
.rate-label{font-size:12px;color:#888;margin-bottom:6px;font-weight:600}
.rate-bar-bg{background:#eee;border-radius:8px;height:12px;overflow:hidden}
.rate-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,#1a73e8,#4ca3ff);transition:width .6s ease}
.rate-text{font-size:13px;font-weight:700;color:#1a73e8;margin-top:4px}

/* Region table */
.section-title{font-size:13px;font-weight:700;color:#888;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.region-table{width:100%;border-collapse:collapse;font-size:14px}
.region-table th{background:#f0f1f5;padding:8px 10px;text-align:left;font-size:11px;color:#888;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.region-table td{padding:9px 10px;border-bottom:1px solid #f0f1f5}
.region-table tr:last-child td{border-bottom:none}
.region-table .num{text-align:right;font-weight:700;color:#1a1f36}
.region-table .rate-cell{text-align:right;font-size:12px}
.rate-pill{padding:2px 8px;border-radius:12px;font-weight:700;font-size:12px}
.rate-high{background:#e8f8f0;color:#0d9e5a}
.rate-mid{background:#fff8e1;color:#f59d00}
.rate-low{background:#fde8e8;color:#e53935}

/* Chart */
.chart-wrap{margin-top:12px;height:200px;position:relative}

/* Directory */
.dir-section{margin-bottom:24px}
.dir-title{font-size:15px;font-weight:800;color:#1a1f36;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0f1f5}
.partner-list{display:flex;flex-direction:column;gap:8px}
.partner-item{background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;text-decoration:none;color:inherit;transition:box-shadow .2s}
.partner-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.pi-left{display:flex;align-items:center;gap:10px}
.pi-name{font-size:15px;font-weight:700;color:#1a1f36}
.pi-regions{font-size:12px;color:#999;margin-top:2px}
.pi-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pi-amount{font-size:14px;font-weight:800;color:#1a1f36}
.pi-months{display:flex;gap:4px}
.pi-month{font-size:11px;padding:2px 7px;border-radius:10px;background:#f0f1f5;color:#666;font-weight:600}
.pi-month.active{background:#1a1f36;color:#fff}

.no-next{background:#fffbf0;border:1px dashed #fcc;border-radius:8px;padding:10px 14px;font-size:12px;color:#999;text-align:center;margin-top:4px}
</style>
</head>

function fmt(n){return n.toLocaleString('ko-KR');}
function ratePill(r){
  var cls=r>=80?'rate-high':r>=50?'rate-mid':'rate-low';
  return '<span class="rate-pill '+cls+'">'+r+'%</span>';
}

function getParams(){
  var p=new URLSearchParams(location.search);
  return {pid:p.get('pid')?parseInt(p.get('pid')):null, month:p.get('month')?parseInt(p.get('month')):null};
}

function getReports(pid){
  return DATA.filter(function(r){return r.pid===pid;}).sort(function(a,b){return a.month_num-b.month_num;});
}

function renderMonth(r,container){
  var regions=r.regions;
  var regionRows=regions.map(function(reg){
    var rate=reg.total>0?Math.round(reg.partner/reg.total*100):0;

  }).join('');

  var rateW=Math.min(r.rate,100);
  var rateColor=r.rate>=80?'#0d9e5a':r.rate>=50?'#f59d00':'#e53935';

  container.innerHTML=
    '<div class="rate-section">'+
      '<div class="rate-label">참여율</div>'+
      '<div class="rate-bar-bg"><div class="rate-bar" style="width:'+rateW+'%;background:linear-gradient(90deg,'+rateColor+','+rateColor+'99)"></div></div>'+
      '<div class="rate-text">'+r.rate+'%</div>'+
    '</div>'+
    '<div class="metrics">'+
      '<div class="metric"><div class="metric-label">생성건수</div><div class="metric-value">'+fmt(r.generated)+'</div><div class="metric-sub">건</div></div>'+
      '<div class="metric green-bg"><div class="metric-label">참여건수</div><div class="metric-value">'+fmt(r.participated)+'</div><div class="metric-sub">건</div></div>'+
      '<div class="metric highlight" style="grid-column:1/-1"><div class="metric-label">정산금액</div><div class="metric-value">'+fmt(r.bank_amount)+'<span style="font-size:14px;font-weight:400"> 원</span></div><div class="metric-sub">참여건당 '+fmt(r.aov)+'원</div></div>'+
    '</div>'+
    '<div class="section-title">지역별 현황</div>'+
    '<table class="region-table">'+
      '<thead><tr><th>지역</th><th>생성</th><th>참여</th><th>참여율</th></tr></thead>'+
      '<tbody>'+regionRows+'</tbody>'+
    '</table>'+
    '<div class="chart-wrap"><canvas id="regionChart"></canvas></div>';

  setTimeout(function(){
    var ctx=document.getElementById('regionChart');
    if(!ctx)return;
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:regions.map(function(r){return r.region.replace('경기 ','').replace('서울 ','');}),
        datasets:[
          {label:'생성',data:regions.map(function(r){return r.total;}),backgroundColor:'#e8f0fe',borderRadius:4},
          {label:'참여',data:regions.map(function(r){return r.partner;}),backgroundColor:'#1a73e8',borderRadius:4}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}}}
    });
  },50);
}

function renderPartner(pid){
  var reports=getReports(pid);
  if(!reports.length){
    document.getElementById('app').innerHTML='<div class="not-found"><h2>파트너를 찾을 수 없습니다</h2><p>PID: '+pid+'</p></div>';
    return;
  }
  var r0=reports[reports.length-1]; // latest
  var params=getParams();
  var activeMonth=params.month||r0.month_num;
  var activeReport=reports.find(function(r){return r.month_num===activeMonth;})||r0;

  var typeBadge='<span class="type-badge type-'+r0.type+'">'+r0.type+'</span>';
  var tabs=reports.map(function(r){
    var cls=r.month_num===activeMonth?'month-tab active':'month-tab';
    return '<button class="'+cls+'" onclick="window.location.search=\'?pid='+pid+'&month='+r.month_num+'\'">'+r.year+'년 '+r.month_num+'월</button>';
  }).join('');

  document.getElementById('app').innerHTML=
    '<div class="partner-card">'+
      '<div class="partner-header">'+typeBadge+'<div class="partner-name">'+r0.name+'</div></div>'+
      '<div class="month-tabs">'+tabs+'</div>'+
      '<div id="month-content"></div>'+
      '<div class="no-next">다음달 예정금액: 미정</div>'+
    '</div>';

  renderMonth(activeReport, document.getElementById('month-content'));
}

function renderDirectory(){
  var byPid={};
  DATA.forEach(function(r){
    if(!byPid[r.pid]) byPid[r.pid]={name:r.name,type:r.type,months:[],lastSettle:0,regions:[]};
    byPid[r.pid].months.push(r.month_num);
    byPid[r.pid].lastSettle=Math.max(byPid[r.pid].lastSettle,r.bank_amount);
    r.regions.forEach(function(reg){if(!byPid[r.pid].regions.includes(reg.region))byPid[r.pid].regions.push(reg.region);});
  });

  var mv=[], mvs=[];
  Object.keys(byPid).forEach(function(pid){
    var d=byPid[pid];
    var months=d.months.sort(function(a,b){return a-b;});
    var monthChips=months.map(function(m){
      var isLatest=m===months[months.length-1];
      return '<span class="pi-month'+(isLatest?' active':'')+'">'+m+'월</span>';
    }).join('');
    var item='<a class="partner-item" href="?pid='+pid+'">'+
      '<div class="pi-left">'+
        '<div>'+
          '<span class="type-badge type-'+d.type+'">'+d.type+'</span>'+
          '<div class="pi-name" style="margin-top:4px">'+d.name+'</div>'+
          '<div class="pi-regions">'+d.regions.slice(0,3).join(', ')+(d.regions.length>3?' 외 '+(d.regions.length-3)+'개':'')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="pi-right"><div class="pi-amount">'+fmt(d.lastSettle)+'원</div><div class="pi-months">'+monthChips+'</div></div>'+
    '</a>';
    if(d.type==='MV') mv.push(item);
    else mvs.push(item);
  });

  document.getElementById('app').innerHTML=
    '<div class="dir-section"><div class="dir-title">🚛 MV 파트너 ('+mv.length+'개)</div><div class="partner-list">'+mv.join('')+'</div></div>'+
    '<div class="dir-section"><div class="dir-title">📦 MVS 파트너 ('+mvs.length+'개)</div><div class="partner-list">'+mvs.join('')+'</div></div>';
}

var params=getParams();
if(params.pid) renderPartner(params.pid);
else renderDirectory();
</script>
</body>
</html>
