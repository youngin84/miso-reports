var CFG = {
  DC:  { label:'DC (일반청소)', color:'#3b82f6', bg:'rgba(59,130,246,0.15)',  chip:'#dbeafe', chipTxt:'#1d4ed8' },
  MV:  { label:'MV (이사)',     color:'#10b981', bg:'rgba(16,185,129,0.15)',  chip:'#d1fae5', chipTxt:'#065f46' },
  MVS: { label:'MVS (소형이사)',color:'#f59e0b', bg:'rgba(245,158,11,0.15)', chip:'#fef3c7', chipTxt:'#92400e' },
  EXP: { label:'EXP (익스팬션)',color:'#ec4899', bg:'rgba(236,72,153,0.15)', chip:'#fce7f3', chipTxt:'#9d174d' }
};
var SVCS = ['DC','MV','MVS','EXP'];
var state = { view: 'all', month: null };
var charts = { amt: null };

function fmtShort(v) {
  if (v >= 100000000) return (v/100000000).toFixed(1) + '억';
  if (v >= 10000000)  return (v/10000000).toFixed(1) + '천만';
  if (v >= 1000000)   return (v/1000000).toFixed(1) + '백만';
  return (v/10000).toFixed(0) + '만';
}
function fmtFull(v) { return v.toLocaleString() + '원'; }
function activeSvcs() { return state.view === 'all' ? SVCS : [state.view]; }
function allMonths() {
  var s = new Set();
  activeSvcs().forEach(function(sv) { Object.keys(RAW[sv].totals).forEach(function(m) { s.add(m); }); });
  return Array.from(s).sort();
}

function renderCards() {
  var html = '';
  SVCS.forEach(function(sv) {
    var d = RAW[sv];
    var months = Object.keys(d.totals).sort();
    var last = months[months.length-1];
    var lastAmt = d.totals[last] || 0;
    var lastAct = d.active[last] || 0;
    var total = Object.values(d.totals).reduce(function(a,b){return a+b;},0);
    var c = CFG[sv];
    var sel = state.view === sv ? 'sel' : '';
    html += '<div class="scard ' + sel + '" style="--c:' + c.color + '" onclick="setView(\'' + sv + '\')">' +
      '<div class="scard-chip" style="background:' + c.chip + ';color:' + c.chipTxt + '">' + sv + '</div>' +
      '<div class="scard-label">최근월 디비전 금액</div>' +
      '<div class="scard-val">' + fmtShort(lastAmt) + '</div>' +
      '<div class="scard-meta">' + last + ' &middot; 계약 ' + lastAct + '건</div>' +
      '<div class="scard-divider"><span>누적 총액</span><span>' + fmtShort(total) + '</span></div>' +
    '</div>';
  });
  document.getElementById('cards').innerHTML = html;
}

function renderCharts() {
  var svcs = activeSvcs();
  var months = allMonths();
  if (charts.amt) { charts.amt.destroy(); charts.amt = null; }
  var amtDatasets = svcs.map(function(sv) {
    return {
      label: CFG[sv].label,
      data: months.map(function(m) { return RAW[sv].totals[m] || 0; }),
      backgroundColor: CFG[sv].bg,
      borderColor: CFG[sv].color,
      borderWidth: 2,
      borderRadius: 4
    };
  });
  charts.amt = new Chart(document.getElementById('chartAmt').getContext('2d'), {
    type: 'bar',
    data: { labels: months.map(function(m){ return m.slice(2); }), datasets: amtDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font:{size:11}, padding:12, boxWidth:12 } },
        tooltip: { callbacks: { label: function(c){ return ' ' + c.dataset.label + ': ' + fmtFull(c.raw); } } }
      },
      scales: {
        x: { stacked: svcs.length > 1, grid:{display:false}, ticks:{font:{size:10}} },
        y: { stacked: svcs.length > 1, grid:{color:'#f5f5f5'}, ticks:{font:{size:10}, callback:function(v){return fmtShort(v);}} }
      }
    }
  });
}

function renderMonthPills() {
  var months = allMonths().slice().reverse();
  if (!state.month || months.indexOf(state.month) === -1) { state.month = months[0]; }
  var html = '';
  months.forEach(function(m) {
    var cls = m === state.month ? 'active' : '';
    html += '<button class="mpill ' + cls + '" onclick="selectMonth(\'' + m + '\')">' + m.slice(2) + '</button>';
  });
  document.getElementById('month-pills').innerHTML = html;
}

function renderDetail() {
  var svcs = activeSvcs();
  var m = state.month;
  var el = document.getElementById('detail-body');
  if (!m) { el.innerHTML = '<div class="empty-msg">월을 선택하세요</div>'; return; }
  var rows = [];
  var grandTotal = 0;
  svcs.forEach(function(sv) {
    var partners = RAW[sv].partners[m] || [];
    var total = RAW[sv].totals[m] || 0;
    if (total > 0) { rows.push({ sv:sv, partners:partners, total:total }); grandTotal += total; }
  });
  if (rows.length === 0) { el.innerHTML = '<div class="empty-msg">해당 월에 데이터가 없습니다</div>'; return; }
  var html = '<table><thead><tr>' +
    '<th style="width:90px">서비스</th>' +
    '<th>신규계약 파트너 (해당 월 계약 시작)</th>' +
    '<th style="width:160px;text-align:right">디비전 금액</th>' +
    '</tr></thead><tbody>';
  rows.forEach(function(r) {
    var c = CFG[r.sv];
    var regionMap = REGIONS[r.sv] || {};
    var chips = r.partners.map(function(p) {
      var reg = regionMap[p] || '';
      return '<span class="pchip" title="' + reg + '">' + p + (reg ? '<span class="pchip-reg"> &middot; ' + reg + '</span>' : '') + '</span>';
    }).join('');
    html += '<tr>' +
      '<td><span class="stag" style="background:' + c.chip + ';color:' + c.chipTxt + '">' + r.sv + '</span></td>' +
      '<td>' + (chips ? '<div class="partner-chips">' + chips + '</div>' : '') +
        '<div class="cnt-label">총 <b style="color:' + c.color + '">' + r.partners.length + '개사</b> 신규계약</div></td>' +
      '<td class="amt-cell" style="color:' + c.color + '">' + fmtFull(r.total) + '</td></tr>';
  });
  if (rows.length > 1) {
    html += '<tr class="total-row"><td colspan="2" style="padding:12px 14px">합계</td><td class="amt-cell">' + fmtFull(grandTotal) + '</td></tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

document.getElementById('tabs-bar').addEventListener('click', function(e) {
  var tab = e.target.closest('.tab');
  if (!tab) return;
  var v = tab.getAttribute('data-view');
  if (v) setView(v);
});

function setView(v) {
  state.view = v;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-view') === v); });
  state.month = null;
  renderCards(); renderCharts(); renderMonthPills(); renderDetail(); renderPartnerSummary();
}

function selectMonth(m) { state.month = m; renderMonthPills(); renderDetail(); }

function renderPartnerSummary() {
  var svcs = activeSvcs();
  var el = document.getElementById('partner-summary');
  var byPartner = [];
  svcs.forEach(function(sv) {
    var cm = RAW[sv].contract_months || {};
    Object.keys(cm).sort().forEach(function(p) { byPartner.push({ sv:sv, name:p, months:cm[p] }); });
  });
  if (byPartner.length === 0) { el.innerHTML = '<div class="empty-msg">데이터가 없습니다</div>'; return; }
  el.innerHTML = byPartner.map(function(p) {
    var c = CFG[p.sv];
    var reg = (REGIONS[p.sv] || {})[p.name] || '';
    var startDate = (STARTS[p.sv] || {})[p.name] || '';
    var chips = p.months.map(function(m) {
      return '<span class="mchip" style="background:' + c.bg + ';color:' + c.color + '">' + m.slice(2) + '</span>';
    }).join('');
    return '<div class="prow">' +
      '<span class="prow-svc" style="background:' + c.chip + ';color:' + c.chipTxt + '">' + p.sv + '</span>' +
      '<div class="prow-name">' + p.name + '</div>' +
      (reg ? '<div class="prow-region">📍 ' + reg + '</div>' : '') +
      (startDate ? '<div class="prow-start">최초계약 <b style="color:' + c.color + '">' + startDate.slice(2) + '</b></div>' : '') +
      '<div class="prow-months">' + chips + '</div></div>';
  }).join('');
}

window.addEventListener('load', function() {
  renderCards(); renderCharts(); renderMonthPills(); renderDetail(); renderPartnerSummary();
});

</script>
